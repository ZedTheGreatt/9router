# Render — 9router (free tier, Node runtime)
# Deploy via: https://render.com/new → Web Service → connect repo

services:
  - type: web
    name: 9router
    runtime: node
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    buildCommand: npm install && npm run build
    startCommand: node custom-server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 20128
      - key: DATA_DIR
        value: /mnt/data
      - key: JWT_SECRET
        generateValue: true
      - key: INITIAL_PASSWORD
        generateValue: true
      - key: API_KEY_SECRET
        generateValue: true
      - key: MACHINE_ID_SALT
        generateValue: true
      - key: ENABLE_REQUEST_LOGS
        value: "false"
      - key: OBSERVABILITY_ENABLED
        value: "true"
      - key: AUTH_COOKIE_SECURE
        value: "true"
      - key: REQUIRE_API_KEY
        value: "false"
      - key: CLOUD_URL
        value: https://9router.com
      - key: NEXT_PUBLIC_CLOUD_URL
        value: https://9router.com
    disk:
      name: data
      mountPath: /mnt/data
      sizeGB: 1
