# Render — 9router (free tier)
# Deploy via: https://render.com/new
# Select "Web Service" → connect repo → Render auto-detects this file.

services:
  - type: web
    name: 9router
    runtime: image
    image:
      url: https://github.com/ZedTheGreatt/9router.git
      branch: master
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 20128
      - key: DATA_DIR
        value: /app/data
      - key: JWT_SECRET
        generateValue: true
      - key: INITIAL_PASSWORD
        generateValue: true
      - key: API_KEY_SECRET
        generateValue: true
      - key: MACHINE_ID_SALT
        generateValue: true
      - key: ENABLE_REQUEST_LOGS
        value: "false"
      - key: OBSERVABILITY_ENABLED
        value: "true"
      - key: AUTH_COOKIE_SECURE
        value: "true"
      - key: REQUIRE_API_KEY
        value: "false"
      - key: CLOUD_URL
        value: https://9router.com
      - key: NEXT_PUBLIC_CLOUD_URL
        value: https://9router.com
    disk:
      name: data
      mountPath: /app/data
      sizeGB: 1
